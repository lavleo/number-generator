<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Theme tokens ── */
[data-theme="dark"] {
  --bg:           #0a0b0e;
  --bg-grid:      rgba(255,255,255,0.025);
  --surface:      #111318;
  --surface-2:    #1a1d24;
  --surface-3:    #222630;
  --border:       rgba(255,255,255,0.07);
  --border-hover: rgba(255,255,255,0.15);
  --accent:       #b8ff3c;
  --accent-dim:   rgba(184,255,60,0.1);
  --accent-2:     #3cbaff;
  --fg:           #e8eaf0;
  --fg-2:         #9499aa;
  --fg-3:         #555b6e;
  --danger:       #ff5757;
  --shadow:       0 4px 24px rgba(0,0,0,0.4);
  --shadow-lg:    0 12px 48px rgba(0,0,0,0.6);
  --toggle-bg:    #1a1d24;
  --icon-sun:     0.3;
  --icon-moon:    1;
}
[data-theme="light"] {
  --bg:           #f2f3f7;
  --bg-grid:      rgba(0,0,0,0.04);
  --surface:      #ffffff;
  --surface-2:    #f5f6fa;
  --surface-3:    #ecedf4;
  --border:       rgba(0,0,0,0.07);
  --border-hover: rgba(0,0,0,0.18);
  --accent:       #5a3af5;
  --accent-dim:   rgba(90,58,245,0.08);
  --accent-2:     #0076d1;
  --fg:           #1a1d24;
  --fg-2:         #5a5f73;
  --fg-3:         #a0a5b8;
  --danger:       #d93535;
  --shadow:       0 2px 16px rgba(0,0,0,0.08);
  --shadow-lg:    0 8px 40px rgba(0,0,0,0.12);
  --toggle-bg:    #e8e9f0;
  --icon-sun:     1;
  --icon-moon:    0.3;
}

/* ── Base ── */
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 16px 96px;
  transition: background 0.3s, color 0.3s;
  position: relative;
}

/* Grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* ── Layout wrapper ── */
.layout {
  width: 100%;
  max-width: 520px;
  position: relative;
  z-index: 1;
}

/* ── Header ── */
header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 36px;
}
.header-left {}
.header-eyebrow {
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin-bottom: 6px;
}
.header-title {
  font-family: 'Syne', sans-serif;
  font-size: 32px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--fg);
}
.header-title span {
  color: var(--accent);
}

/* ── Theme toggle ── */
.theme-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--toggle-bg);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 5px 10px;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 4px;
}
.theme-toggle:hover {
  border-color: var(--border-hover);
}
.theme-toggle svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  fill: var(--fg);
  transition: opacity 0.2s;
}
.icon-sun  { opacity: var(--icon-sun); }
.icon-moon { opacity: var(--icon-moon); }

.toggle-track {
  width: 28px;
  height: 16px;
  background: var(--surface-3);
  border-radius: 100px;
  border: 1px solid var(--border);
  position: relative;
  transition: background 0.2s;
}
.toggle-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
[data-theme="light"] .toggle-thumb {
  transform: translateX(12px);
}

/* ── Cards ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.card-label {
  font-family: 'Syne', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.card-badge {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--accent-2);
  background: var(--accent-dim);
  border-radius: 4px;
  padding: 2px 7px;
  transition: all 0.2s;
}

/* ── Fields ── */
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.field label {
  display: block;
  font-family: 'Syne', sans-serif;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin-bottom: 6px;
  transition: color 0.2s;
}
.field:focus-within label { color: var(--accent); }

input[type="text"],
input[type="number"],
select {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--fg);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  padding: 9px 11px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.3s;
  -moz-appearance: textfield;
  appearance: none;
}
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
input:focus, select:focus {
  border-color: var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

/* ── Buttons ── */
.btn-row {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  align-items: center;
}
button {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-radius: 8px;
  padding: 9px 16px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  border: 1px solid transparent;
  line-height: 1;
}
.btn-primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
[data-theme="dark"] .btn-primary { color: #0a0b0e; }
[data-theme="light"] .btn-primary { color: #ffffff; }
.btn-primary:hover:not(:disabled) {
  filter: brightness(1.1);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px var(--accent-dim);
}
.btn-secondary {
  background: var(--surface-2);
  color: var(--fg-2);
  border-color: var(--border);
}
.btn-secondary:hover:not(:disabled) {
  background: var(--surface-3);
  color: var(--fg);
  border-color: var(--border-hover);
}
.btn-ghost {
  background: transparent;
  color: var(--fg-3);
  border-color: transparent;
  padding-left: 8px;
  padding-right: 8px;
}
.btn-ghost:hover:not(:disabled) {
  color: var(--fg);
  background: var(--surface-2);
}
button:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  pointer-events: none;
}
.ml-auto { margin-left: auto; }

/* ── Output list ── */
.list-meta {
  font-size: 11px;
  color: var(--fg-3);
}
.list-meta strong {
  color: var(--accent-2);
  font-weight: 500;
}
#output-list {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  height: 216px;
  overflow-y: auto;
  margin-bottom: 16px;
  transition: background 0.3s, border-color 0.3s;
}
#output-list:empty::after {
  content: 'No items generated yet.';
  display: block;
  padding: 20px 16px;
  font-size: 12px;
  color: var(--fg-3);
}
.list-item {
  font-size: 12.5px;
  padding: 5px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 2px;
  transition: background 0.1s;
}
.list-item:last-child { border-bottom: none; }
.list-item:hover { background: var(--surface-3); }
.num-index {
  color: var(--fg-3);
  font-size: 10px;
  width: 28px;
  flex-shrink: 0;
}
.num-prefix { color: var(--accent); }
.num-body   { color: var(--fg); }

/* scrollbar */
#output-list::-webkit-scrollbar { width: 4px; }
#output-list::-webkit-scrollbar-track { background: transparent; }
#output-list::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }

/* ── Divider ── */
hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

/* ── Print settings ── */
.print-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* ── Error ── */
.field-error input { border-color: var(--danger) !important; box-shadow: 0 0 0 3px rgba(255,87,87,0.1) !important; }
.error-msg {
  font-size: 10px;
  color: var(--danger);
  margin-top: 4px;
  display: none;
  font-family: 'DM Mono', monospace;
}
.field-error .error-msg { display: block; }

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--surface);
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  padding: 10px 20px;
  border-radius: 100px;
  opacity: 0;
  transition: opacity 0.2s, transform 0.25s cubic-bezier(0.34,1.4,0.64,1);
  pointer-events: none;
  z-index: 999;
  box-shadow: var(--shadow-lg);
  white-space: nowrap;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Modal ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: min(480px, 100%);
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  animation: modal-in 0.2s cubic-bezier(0.34,1.2,0.64,1);
}
@keyframes modal-in {
  from { opacity: 0; transform: scale(0.95) translateY(8px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-title {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-3);
  flex: 1;
}
.page-nav {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--fg-2);
}
.page-nav-btn {
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--fg-2);
  cursor: pointer;
  padding: 0;
  font-family: inherit;
  font-weight: 700;
  transition: all 0.15s;
}
.page-nav-btn:hover:not(:disabled) {
  background: var(--surface-3);
  border-color: var(--border-hover);
  color: var(--fg);
}
.modal-body {
  flex: 1;
  overflow-y: auto;
  background: #c8c9cc;
  display: flex;
  justify-content: center;
  padding: 24px;
}
[data-theme="dark"] .modal-body { background: #6e7280; }
.paper {
  background: #fff;
  color: #111;
  width: 100%;
  max-width: 340px;
  min-height: 440px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  padding: 48px 40px;
  border-radius: 2px;
}
.paper-items { line-height: 1.75; }

/* ── Print ── */
@media print {
  body > *:not(#print-frame) { display: none !important; }
  #print-frame { display: block !important; }  /* removed position:fixed/inset */
}
#print-frame { display: none; }

/* ── Subtle entry animations ── */
.card {
  animation: card-in 0.35s ease both;
}
.card:nth-child(1) { animation-delay: 0.05s; }
.card:nth-child(2) { animation-delay: 0.10s; }
.card:nth-child(3) { animation-delay: 0.15s; }
@keyframes card-in {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
header { animation: card-in 0.3s ease both; }
</style>
</head>
<body>

<div class="layout">

<!-- ── Header ── -->
<header>
  <div class="header-left">
    <div class="header-eyebrow">Utility Tool</div>
    <div class="header-title">Number <span>Gen</span></div>
  </div>
  <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
    <!-- Sun icon -->
    <svg class="icon-sun" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
      <circle cx="8" cy="8" r="3.5"/>
      <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M11.89 4.11l1.06-1.06M3.05 12.95l1.06-1.06" stroke-width="1.2" stroke="currentColor" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="toggle-track"><div class="toggle-thumb"></div></div>
    <!-- Moon icon -->
    <svg class="icon-moon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
      <path d="M13.5 10.5a6 6 0 01-8-8 6.5 6.5 0 108 8z"/>
    </svg>
  </button>
</header>

<!-- ── Generation card ── -->
<div class="card">
  <div class="card-header">
    <div class="card-label">Parameters</div>
  </div>
  <div class="fields">
    <div class="field" id="field-prefix">
      <label>Prefix</label>
      <input type="text" id="inp-prefix" value="C" maxlength="20" placeholder="e.g. C">
    </div>
    <div class="field" id="field-start">
      <label>Start</label>
      <input type="number" id="inp-start" value="1" min="0">
    </div>
    <div class="field" id="field-amount">
      <label>Amount</label>
      <input type="number" id="inp-amount" value="5" min="1" max="10000">
      <div class="error-msg" id="err-amount">Enter 1–10,000</div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn-primary" id="btn-generate">Generate</button>
    <button class="btn-secondary" id="btn-more" disabled>+ More</button>
  </div>
</div>

<!-- ── Output card ── -->
<div class="card">
  <div class="card-header">
    <div class="card-label">Output</div>
    <div class="list-meta">Items: <strong id="count-label">0</strong></div>
  </div>
  <div id="output-list"></div>
  <div class="btn-row">
    <button class="btn-secondary" id="btn-copy" disabled>Copy All</button>
    <button class="btn-secondary" id="btn-preview" disabled>Preview</button>
    <button class="btn-secondary" id="btn-print" disabled>Print…</button>
    <button class="btn-ghost ml-auto" id="btn-clear" disabled>Clear</button>
  </div>
</div>

<!-- ── Print settings card ── -->
<div class="card">
  <div class="card-header" style="margin-bottom:14px">
    <div class="card-label">Print Settings</div>
  </div>
  <div class="print-grid">
    <div class="field">
      <label>Font</label>
      <select id="sel-font">
        <option value="'DM Mono', monospace">DM Mono</option>
        <option value="'Courier New', monospace">Courier New</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
        <option value="Arial, sans-serif">Arial</option>
        <option value="Verdana, sans-serif">Verdana</option>
      </select>
    </div>
    <div class="field">
      <label>Size (pt)</label>
      <input type="number" id="inp-fontsize" value="18" min="6" max="72">
    </div>
    <div class="field">
      <label>Weight</label>
      <select id="sel-weight">
        <option value="400">Normal</option>
        <option value="700">Bold</option>
      </select>
    </div>
    <div class="field">
      <label>Items / Page</label>
      <input type="number" id="inp-ipp" value="20" min="1" max="200">
    </div>
  </div>
</div>

</div><!-- /layout -->

<!-- ── Toast ── -->
<div id="toast"></div>

<!-- ── Preview modal ── -->
<div class="modal-overlay" id="preview-modal">
  <div class="modal">
    <div class="modal-toolbar">
      <span class="modal-title">Print Preview</span>
      <div class="page-nav">
        <button class="page-nav-btn" id="btn-prev-page">&#8592;</button>
        <span id="page-label">1 / 1</span>
        <button class="page-nav-btn" id="btn-next-page">&#8594;</button>
      </div>
      <button class="btn-primary" id="btn-modal-print" style="padding:7px 14px;font-size:10px">Print…</button>
      <button class="btn-ghost" id="btn-modal-close" style="font-size:14px;padding:4px 8px">&#10005;</button>
    </div>
    <div class="modal-body">
      <div class="paper">
        <div class="paper-items" id="paper-content"></div>
      </div>
    </div>
  </div>
</div>

<div id="print-frame"></div>

<script>
// ── State ──
const state = {
  items: [],
  lastStart: 0,
  lastAmount: 0,
  lastPrefix: '',
  previewPage: 0,
};

// ── DOM ──
const inpPrefix    = document.getElementById('inp-prefix');
const inpStart     = document.getElementById('inp-start');
const inpAmount    = document.getElementById('inp-amount');
const inpFontSize  = document.getElementById('inp-fontsize');
const inpIPP       = document.getElementById('inp-ipp');
const selFont      = document.getElementById('sel-font');
const selWeight    = document.getElementById('sel-weight');
const outputList   = document.getElementById('output-list');
const countLabel   = document.getElementById('count-label');
const btnGenerate  = document.getElementById('btn-generate');
const btnMore      = document.getElementById('btn-more');
const btnCopy      = document.getElementById('btn-copy');
const btnPreview   = document.getElementById('btn-preview');
const btnPrint     = document.getElementById('btn-print');
const btnClear     = document.getElementById('btn-clear');
const previewModal = document.getElementById('preview-modal');
const paperContent = document.getElementById('paper-content');
const pageLabel    = document.getElementById('page-label');
const btnPrevPage  = document.getElementById('btn-prev-page');
const btnNextPage  = document.getElementById('btn-next-page');
const btnModalPrint= document.getElementById('btn-modal-print');
const btnModalClose= document.getElementById('btn-modal-close');
const toast        = document.getElementById('toast');
const printFrame   = document.getElementById('print-frame');
const themeToggle  = document.getElementById('theme-toggle');

// ── Theme ──
themeToggle.addEventListener('click', () => {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
});

// ── Helpers ──
function showToast(msg, dur = 2200) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), dur);
}

function setActionButtons(on) {
  [btnMore, btnCopy, btnPreview, btnPrint, btnClear].forEach(b => b.disabled = !on);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderList() {
  outputList.innerHTML = '';
  state.items.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'list-item';
    const prefix  = state.lastPrefix;
    const numPart = item.slice(prefix.length);
    div.innerHTML = `<span class="num-index">${i+1}</span><span class="num-prefix">${escHtml(prefix)}</span><span class="num-body">${escHtml(numPart)}</span>`;
    outputList.appendChild(div);
  });
  outputList.scrollTop = outputList.scrollHeight;
  countLabel.textContent = state.items.length;
}

function getPrint() {
  return {
    fontFamily:   selFont.value,
    fontSize:     Math.max(6, Math.min(72, parseInt(inpFontSize.value)||18)),
    fontWeight:   selWeight.value,
    itemsPerPage: Math.max(1, Math.min(200, parseInt(inpIPP.value)||20)),
  };
}

function totalPages() {
  return Math.max(1, Math.ceil(state.items.length / getPrint().itemsPerPage));
}

// ── Validation ──
function validate() {
  const n = parseInt(inpAmount.value);
  const f = document.getElementById('field-amount');
  if (!n || n < 1 || n > 10000) { f.classList.add('field-error'); return false; }
  f.classList.remove('field-error');
  return true;
}
inpAmount.addEventListener('input', () => document.getElementById('field-amount').classList.remove('field-error'));

// ── Generate ──
function doGenerate(start, amount, prefix, append) {
  if (!append) state.items = [];
  for (let i = 0; i < amount; i++) state.items.push(prefix + (start + i));
  renderList();
  setActionButtons(true);
}

btnGenerate.addEventListener('click', () => {
  if (!validate()) return;
  state.lastStart  = parseInt(inpStart.value)  || 0;
  state.lastAmount = parseInt(inpAmount.value) || 5;
  state.lastPrefix = inpPrefix.value;
  doGenerate(state.lastStart, state.lastAmount, state.lastPrefix, false);
  showToast(`Generated ${state.lastAmount} item${state.lastAmount !== 1 ? 's' : ''}`);
});

btnMore.addEventListener('click', () => {
  state.lastStart += state.lastAmount;
  doGenerate(state.lastStart, state.lastAmount, state.lastPrefix, true);
  showToast(`Added ${state.lastAmount} more items`);
});

btnClear.addEventListener('click', () => {
  state.items = [];
  renderList();
  setActionButtons(false);
  showToast('Cleared');
});

[inpPrefix, inpStart, inpAmount].forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter') btnGenerate.click(); });
});

// ── Copy ──
btnCopy.addEventListener('click', () => {
  if (!state.items.length) return;
  navigator.clipboard.writeText(state.items.join('\r\n'))
    .then(() => showToast('Copied to clipboard ✓'))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = state.items.join('\n');
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied to clipboard ✓');
    });
});

// ── Preview ──
function renderPreviewPage() {
  const { fontFamily, fontSize, fontWeight, itemsPerPage } = getPrint();
  const tp = totalPages();
  state.previewPage = Math.max(0, Math.min(state.previewPage, tp - 1));
  pageLabel.textContent    = `${state.previewPage + 1} / ${tp}`;
  btnPrevPage.disabled     = state.previewPage === 0;
  btnNextPage.disabled     = state.previewPage === tp - 1;
  const slice = state.items.slice(state.previewPage * itemsPerPage, (state.previewPage + 1) * itemsPerPage);
  paperContent.style.fontFamily = fontFamily;
  paperContent.style.fontSize   = fontSize + 'px';
  paperContent.style.fontWeight = fontWeight;
  paperContent.innerHTML = slice.map(s => `<div>${escHtml(s)}</div>`).join('');
}

btnPreview.addEventListener('click', () => {
  state.previewPage = 0;
  renderPreviewPage();
  previewModal.classList.add('open');
});
btnPrevPage.addEventListener('click', () => { state.previewPage--; renderPreviewPage(); });
btnNextPage.addEventListener('click', () => { state.previewPage++; renderPreviewPage(); });
btnModalClose.addEventListener('click', () => previewModal.classList.remove('open'));
previewModal.addEventListener('click', e => { if (e.target === previewModal) previewModal.classList.remove('open'); });

// ── Print ──
function doPrint() {
  if (!state.items.length) return;
  const { fontFamily, fontSize, fontWeight, itemsPerPage } = getPrint();
  const tp = Math.max(1, Math.ceil(state.items.length / itemsPerPage));
  let pages = '';
  for (let p = 0; p < tp; p++) {
    const slice = state.items.slice(p * itemsPerPage, (p + 1) * itemsPerPage);
    const pb = p < tp - 1 ? 'page-break-after:always;' : '';
    pages += `<div style="${pb}padding:72px 72px 72px 96px;font-family:${fontFamily};font-size:${fontSize}pt;font-weight:${fontWeight};line-height:1.8;">${slice.map(s => `<div>${escHtml(s)}</div>`).join('')}</div>`;
  }
  printFrame.innerHTML = pages;
  window.print();
  setTimeout(() => { printFrame.innerHTML = ''; }, 1000);
}
btnPrint.addEventListener('click', doPrint);
btnModalPrint.addEventListener('click', () => { previewModal.classList.remove('open'); setTimeout(doPrint, 100); });
</script>
</body>
